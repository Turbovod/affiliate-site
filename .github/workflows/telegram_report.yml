// .github/workflows/telegram_report.yml
name: Telegram Report

on:
  workflow_run:
    workflows: ["Build & Deploy to GitHub Pages"]
    types:
      - completed

jobs:
  report:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="✅ Сайт обновлён. Добавлены новые статьи. Посетите https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d text="$MESSAGE"
